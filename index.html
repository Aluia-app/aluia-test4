<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AluIA – Supporto Psicologico</title>

  <!--
    Versione semplificata: non richiede più alcuna chiave sul client.
    Tutte le chiamate vanno agli endpoint /api/chat   e   /api/tts
    creati nei passaggi precedenti.
  -->

  <style>
    /* … (STILI ORIGINALI NON TOCCATI) … */
    /* Ho rimosso solo eventuali @import esterne inutilizzate */
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <div class="status-bar" id="statusBar">⏳ Controllo server…</div>
  <button class="admin-button" id="adminBtn">⚙️</button>

  <!-- … (IL RESTO DEL MARK‑UP È IDENTICO AL TUO ORIGINALE, TAGLIATO PER BREVITÀ) … -->

  <!-- Admin Modal – ora contiene solo AssistantID e VoiceID -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <span class="close" id="closeAdmin">&times;</span>
      <h2>⚙️ Configurazione Amministratore</h2>
      <div class="admin-form">
        <label for="assistantId">Assistant ID (opzionale):</label>
        <input type="text" id="assistantId" placeholder="asst_..." />

        <label for="voiceId">Voice ID ElevenLabs:</label>
        <select id="voiceId">
          <option value="">Voce nativa di sistema</option>
          <option value="IyWqvgbFwm4IK1x6M489" selected>Voce personalizzata</option>
          <option value="21m00Tcm4TlvDq8ikWAM">Rachel (EN‑F)</option>
          <option value="AZnzlk1XvdvUeBnXmlld">Domi (EN‑F)</option>
          <option value="EXAVITQu4vr4xnSDxMaL">Bella (EN‑F)</option>
          <option value="ErXwobaYiN019PkySvjV">Antoni (EN‑M)</option>
          <option value="MF3mGyEYCl7XYWbV9V6O">Elli (EN‑F)</option>
          <option value="TxGEqnHWrfWFTfGW9XjX">Josh (EN‑M)</option>
        </select>

        <button id="saveAdmin">Salva Configurazione</button>
      </div>
    </div>
  </div>

  <script>
    // Utility: HTTPS / localhost check
    function isSecureLikeContext() {
      const { protocol, hostname } = location;
      return protocol === "https:" || hostname === "localhost" || hostname === "127.0.0.1";
    }

    class AluIA {
      constructor() {
        /* ---------- STATO BASE ---------- */
        this.recognition = null;
        this.isListening = false;
        this.isSpeaking = false;
        this.autoRestartEnabled = true;
        this.conversationHistory = [];

        /* ---------- PREFERENZE UTENTE ---------- */
        this.isDarkMode = localStorage.getItem("aluia_theme") === "dark";
        this.assistantId = localStorage.getItem("aluia_assistant_id") || "";
        this.voiceId = localStorage.getItem("aluia_voice_id") || "IyWqvgbFwm4IK1x6M489";

        /* ---------- VARIABILI INTERNE ---------- */
        this.ignoreAsrUntil = 0; // muto l'ASR mentre parlo
        this.postTtsCooldownMs = 800;

        /* ---------- INIZIALIZZAZIONE ---------- */
        this.initElements();
        this.initSpeechRecognition();
        this.initEventListeners();
        this.applyTheme();
        this.checkServerStatus();
        setTimeout(() => this.startAutoListening(), 1000);
      }

      /* ----- DOM ELEMENTS ----- */
      initElements() {
        this.microphoneButton = document.getElementById("microphoneButton");
        this.microphoneStatus = document.getElementById("microphoneStatus");
        this.transcriptArea = document.getElementById("transcriptArea");
        this.chatContainer = document.getElementById("chatContainer");
        this.chatInput = document.getElementById("chatInput");
        this.sendButton = document.getElementById("sendButton");
        this.typingIndicator = document.getElementById("typingIndicator");
        this.statusBar = document.getElementById("statusBar");
        this.themeToggle = document.getElementById("themeToggle");
        this.adminBtn = document.getElementById("adminBtn");
        this.privacyModal = document.getElementById("privacyModal");
        this.adminModal = document.getElementById("adminModal");
        this.saveAdminBtn = document.getElementById("saveAdmin");
      }

      /* ----- SPEECH RECOGNITION ----- */
      initSpeechRecognition() {
        if (!("webkitSpeechRecognition" in window || "SpeechRecognition" in window)) {
          this.showToast("Riconoscimento vocale non supportato", "error");
          return;
        }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.recognition = new SR();
        this.recognition.continuous = true;
        this.recognition.interimResults = true;
        this.recognition.lang = "it-IT";

        this.recognition.onstart = () => {
          this.isListening = true;
          this.updateMicUI();
        };

        this.recognition.onresult = (e) => {
          if (this.isSpeaking || Date.now() < this.ignoreAsrUntil) return;
          let final = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript;
          }
          if (final.trim()) {
            this.transcriptArea.textContent = "";
            this.processUserMessage(final.trim());
          }
        };

        this.recognition.onerror = () => this.restartListening(2000);
        this.recognition.onend = () => this.restartListening(1200);
      }

      startListening() {
        try {
          this.recognition && this.recognition.start();
        } catch {}
      }
      stopListening() {
        try {
          this.recognition && this.recognition.stop();
        } catch {}
      }
      restartListening(delay = 1500) {
        this.isListening = false;
        this.updateMicUI();
        if (this.autoRestartEnabled && !this.isSpeaking) {
          setTimeout(() => this.startListening(), delay);
        }
      }

      /* ----- EVENT LISTENERS ----- */
      initEventListeners() {
        this.microphoneButton.addEventListener("click", () => {
          this.autoRestartEnabled = !this.autoRestartEnabled;
          if (this.autoRestartEnabled) this.startListening(); else this.stopListening();
          this.updateMicUI();
        });

        this.sendButton.addEventListener("click", () => this.processUserMessage(this.chatInput.value));
        this.chatInput.addEventListener("keypress", (e) => e.key === "Enter" && this.processUserMessage(this.chatInput.value));
        this.themeToggle.addEventListener("click", () => this.toggleTheme());

        /* --- admin modal --- */
        this.adminBtn.addEventListener("click", () => this.adminModal.style.display = "block");
        document.getElementById("closeAdmin").addEventListener("click", () => this.adminModal.style.display = "none");
        this.saveAdminBtn.addEventListener("click", () => this.saveAdminConfig());
      }

      /* ----- UI HELPERS ----- */
      updateMicUI() {
        if (!this.autoRestartEnabled) {
          this.microphoneButton.classList.add("disabled");
          this.microphoneStatus.textContent = "Microfono disattivato";
        } else if (this.isListening) {
          this.microphoneButton.classList.add("listening");
          this.microphoneStatus.textContent = "Parla pure…";
        } else {
          this.microphoneButton.classList.remove("listening", "disabled");
          this.microphoneStatus.textContent = "Microfono in attesa";
        }
      }

      applyTheme() {
        document.body.classList.toggle("dark-mode", this.isDarkMode);
        this.themeToggle.textContent = this.isDarkMode ? "☀️" : "🌙";
      }
      toggleTheme() {
        this.isDarkMode = !this.isDarkMode;
        localStorage.setItem("aluia_theme", this.isDarkMode ? "dark" : "light");
        this.applyTheme();
      }

      showToast(msg, type = "success") {
        const t = document.createElement("div");
        t.className = `toast ${type}`;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.classList.add("show"), 50);
        setTimeout(() => t.classList.remove("show"), 3500);
        setTimeout(() => t.remove(), 4000);
      }

      /* ----- MESSAGGISTICA ----- */
      processUserMessage(text) {
        if (!text) return;
        this.addMessage(text, "user");
        this.chatInput.value = "";
        this.requestAssistant(text);
      }

      addMessage(content, cls) {
        const m = document.createElement("div");
        m.className = `message ${cls}`;
        m.textContent = content;
        this.chatContainer.appendChild(m);
        this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
      }

      async requestAssistant(message) {
        this.typingIndicator.style.display = "flex";
        this.conversationHistory.push({ role: "user", content: message });
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: this.conversationHistory.slice(-10) })
          });
          if (!res.ok) throw new Error("chat api");
          const { content } = await res.json();
          const reply = content || this.getDemoResponse(message);
          this.afterAssistantReply(reply);
        } catch (e) {
          console.warn(e);
          this.afterAssistantReply(this.getDemoResponse(message));
        }
      }

      async afterAssistantReply(reply) {
        this.typingIndicator.style.display = "none";
        this.conversationHistory.push({ role: "assistant", content: reply });
        this.addMessage(reply, "assistant");
        this.ignoreAsrUntil = Date.now() + 1800;
        await this.speak(reply);
      }

      /* ----- TEXT‑TO‑SPEECH ----- */
      async speak(text) {
        try {
          const res = await fetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, voiceId: this.voiceId })
          });
          if (!res.ok) throw new Error("tts api");
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          audio.onplay = () => { this.isSpeaking = true; this.stopListening(); };
          audio.onended = () => { URL.revokeObjectURL(url); this.isSpeaking = false; this.startListening(); };
          audio.onerror = () => this.nativeSpeak(text);
          await audio.play();
        } catch {
          this.nativeSpeak(text);
        }
      }

      nativeSpeak(text) {
        if (!("speechSynthesis" in window)) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "it-IT";
        u.rate = 0.9;
        u.onstart = () => { this.isSpeaking = true; this.stopListening(); };
        u.onend = () => { this.isSpeaking = false; this.startListening(); };
        speechSynthesis.speak(u);
      }

      /* ----- ADMIN MODAL ----- */
      saveAdminConfig() {
        this.assistantId = document.getElementById("assistantId").value.trim();
        this.voiceId     = document.getElementById("voiceId").value.trim() || this.voiceId;
        localStorage.setItem("aluia_assistant_id", this.assistantId);
        localStorage.setItem("aluia_voice_id", this.voiceId);
        this.adminModal.style.display = "none";
        this.showToast("Configurazione salvata");
      }

      /* ----- DEMO FALLBACK ----- */
      getDemoResponse(msg) {
        const rs = [
          "Ti ascolto e capisco quello che stai vivendo.",
          "Grazie per aver condiviso questo con me. Come ti senti ora?",
          "È normale provare quelle emozioni. Vuoi parlarne ancora?",
          "Sono qui con te. Ricorda che non sei solo." 
        ];
        return rs[Math.floor(Math.random()*rs.length)];
      }

      /* ----- SERVER STATUS ----- */
      async checkServerStatus() {
        try {
          const r = await fetch("/api/chat", { method:"POST", headers:{"Content-Type":"application/json"}, body:"{}" });
          this.statusBar.textContent = r.ok ? "✅ Online" : "⚠️ Offline";
          this.statusBar.classList.toggle("connected", r.ok);
        } catch {
          this.statusBar.textContent = "⚠️ Offline";
        }
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      window.aluia = new AluIA();
    });
  </script>
</body>
</html>
