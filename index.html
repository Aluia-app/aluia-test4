<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AluIA – Supporto Psicologico</title>
  <!-- Layout e stile originali invariati -->
  <style>
    /* STILI ORIGINALI (invariati)  */
    *{margin:0;padding:0;box-sizing:border-box}
    /* … copiare qui il blocco <style> che già possiedi (non modificato) … */
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <div class="status-bar" id="statusBar">⏳ Controllo server…</div>
  <button class="admin-button" id="adminBtn">⚙️</button>

  <!-- CONTENUTO ORIGINALE (header, microfono, chat, footer)  -->
  <!-- incolla qui, invariato, il tuo markup esistente fino al </div> principale -->

  <!-- Modal Privacy invariato -->

  <!-- Admin Modal semplificato -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <span class="close" id="closeAdmin">&times;</span>
      <h2>⚙️ Configurazione Amministratore</h2>
      <div class="admin-form">
        <label for="assistantId">Assistant ID (opzionale):</label>
        <input type="text" id="assistantId" placeholder="asst_..." />

        <label for="voiceId">Voice ID ElevenLabs:</label>
        <select id="voiceId">
          <option value="">Voce nativa di sistema</option>
          <option value="IyWqvgbFwm4IK1x6M489" selected>Voce personalizzata</option>
          <option value="21m00Tcm4TlvDq8ikWAM">Rachel (EN‑F)</option>
          <option value="AZnzlk1XvdvUeBnXmlld">Domi (EN‑F)</option>
          <option value="EXAVITQu4vr4xnSDxMaL">Bella (EN‑F)</option>
          <option value="ErXwobaYiN019PkySvjV">Antoni (EN‑M)</option>
          <option value="MF3mGyEYCl7XYWbV9V6O">Elli (EN‑F)</option>
          <option value="TxGEqnHWrfWFTfGW9XjX">Josh (EN‑M)</option>
        </select>

        <button id="saveAdmin">Salva Configurazione</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT PRINCIPALE pulito -->
  <script>
    function isSecureLikeContext(){
      const {protocol,hostname}=location;
      return protocol==='https:'||hostname==='localhost'||hostname==='127.0.0.1';
    }

    class AluIA {
      constructor(){
        /* Stato */
        this.recognition=null;this.isListening=false;this.isSpeaking=false;this.autoRestartEnabled=true;
        this.conversationHistory=[];this.ignoreAsrUntil=0;this.postTtsCooldownMs=900;
        /* Preferenze */
        this.isDarkMode=localStorage.getItem('aluia_theme')==='dark';
        this.assistantId=localStorage.getItem('aluia_assistant_id')||'';
        this.voiceId=localStorage.getItem('aluia_voice_id')||'IyWqvgbFwm4IK1x6M489';
        /* Init */
        this.initElements();this.initSpeech();this.initEvents();this.applyTheme();
        this.checkServer();setTimeout(()=>this.startAutoListening(),1000);
      }

      /* ——— Elementi DOM ——— */
      initElements(){
        this.microphoneButton=document.getElementById('microphoneButton');
        this.microphoneStatus=document.getElementById('microphoneStatus');
        this.transcriptArea=document.getElementById('transcriptArea');
        this.chatContainer=document.getElementById('chatContainer');
        this.chatInput=document.getElementById('chatInput');
        this.sendButton=document.getElementById('sendButton');
        this.typingIndicator=document.getElementById('typingIndicator');
        this.statusBar=document.getElementById('statusBar');
        this.themeToggle=document.getElementById('themeToggle');
        this.adminBtn=document.getElementById('adminBtn');
        this.privacyModal=document.getElementById('privacyModal');
        this.adminModal=document.getElementById('adminModal');
      }

      /* ——— Speech Recognition ——— */
      initSpeech(){
        if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){
          this.showToast('Riconoscimento vocale non supportato','error');return;
        }
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        this.recognition=new SR();
        this.recognition.continuous=true;this.recognition.interimResults=true;this.recognition.lang='it-IT';
        this.recognition.onstart=()=>{this.isListening=true;this.updateMicUI();};
        this.recognition.onresult=e=>{
          if(this.isSpeaking||Date.now()<this.ignoreAsrUntil)return;
          let final='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript;}
          if(final.trim())this.handleUser(final.trim());
        };
        this.recognition.onerror=()=>this.restartListening(2000);
        this.recognition.onend=()=>this.restartListening(1500);
      }
      startListening(){try{this.recognition&&this.recognition.start();}catch{}}
      stopListening(){try{this.recognition&&this.recognition.stop();}catch{}}
      restartListening(d=1500){this.isListening=false;this.updateMicUI();if(this.autoRestartEnabled&&!this.isSpeaking)setTimeout(()=>this.startListening(),d);}

      /* ——— Eventi ——— */
      initEvents(){
        this.microphoneButton.addEventListener('click',()=>{this.autoRestartEnabled=!this.autoRestartEnabled;if(this.autoRestartEnabled)this.startListening();else this.stopListening();this.updateMicUI();});
        this.sendButton.addEventListener('click',()=>this.handleUser(this.chatInput.value));
        this.chatInput.addEventListener('keypress',e=>e.key==='Enter'&&this.handleUser(this.chatInput.value));
        this.themeToggle.addEventListener('click',()=>this.toggleTheme());
        this.adminBtn.addEventListener('click',()=>this.adminModal.style.display='block');
        document.getElementById('closeAdmin').addEventListener('click',()=>this.adminModal.style.display='none');
        document.getElementById('saveAdmin').addEventListener('click',()=>this.saveAdmin());
      }

      /* ——— UI helpers ——— */
      updateMicUI(){
        if(!this.autoRestartEnabled){this.microphoneButton.classList.add('disabled');this.microphoneStatus.textContent='Microfono OFF';}
        else if(this.isListening){this.microphoneButton.classList.add('listening');this.microphoneStatus.textContent='Parla pure…';}
        else{this.microphoneButton.classList.remove('listening','disabled');this.microphoneStatus.textContent='In attesa…';}
      }
      applyTheme(){document.body.classList.toggle('dark-mode',this.isDarkMode);this.themeToggle.textContent=this.isDarkMode?'☀️':'🌙';}
      toggleTheme(){this.isDarkMode=!this.isDarkMode;localStorage.setItem('aluia_theme',this.isDarkMode?'dark':'light');this.applyTheme();}
      showToast(msg,t='success'){const el=document.createElement('div');el.className=`toast ${t}`;el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.classList.add('show'),50);setTimeout(()=>el.remove(),4000);}      

      /* ——— Messaggi ——— */
      handleUser(text){if(!text)return;this.addMsg(text,'user');this.chatInput.value='';this.askAssistant(text);}      
      addMsg(c,cls){const d=document.createElement('div');d.className=`message ${cls}`;d.textContent=c;this.chatContainer.appendChild(d);this.chatContainer.scrollTop=this.chatContainer.scrollHeight;}

      async askAssistant(msg){
        this.typingIndicator.style.display='flex';this.conversationHistory.push({role:'user',content:msg});
        try{
          const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:this.conversationHistory.slice(-10)})});
          if(!r.ok)throw new Error('chat');
          const {content}=await r.json();
          this.afterAssistant(content||this.demo(msg));
        }catch(e){console.warn(e);this.afterAssistant(this.demo(msg));}
      }
      afterAssistant(reply){this.typingIndicator.style.display='none';this.conversationHistory.push({role:'assistant',content:reply});this.addMsg(reply,'assistant');this.ignoreAsrUntil=Date.now()+1800;this.speak(reply);}      

      /* ——— TTS ——— */
      async speak(text){try{
        const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,voiceId:this.voiceId})});
        if(!r.ok)throw new Error('tts');const b=await r.blob();const u=URL.createObjectURL(b);const a=new Audio(u);
        a.onplay=()=>{this.isSpeaking=true;this.stopListening();};a.onended=()=>{URL.revokeObjectURL(u);this.isSpeaking=false;this.startListening();};
        await a.play();
      }catch{this.nativeSpeak(text);}}
      nativeSpeak(t){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.onstart=()=>{this.isSpeaking=true;this.stopListening();};u.onend=()=>{this.isSpeaking=false;this.startListening();};speechSynthesis.speak(u);}      

      /* ——— Admin ——— */
      saveAdmin(){this.assistantId=document.getElementById('assistantId').value.trim();this.voiceId=document.getElementById('voiceId').value.trim()||this.voiceId;localStorage.setItem('aluia_assistant_id',this.assistantId);localStorage.setItem('aluia_voice_id',this.voiceId);this.adminModal.style.display='none';this.showToast('Config salvata');}

      /* ——— Demo fallback ——— */
      demo(){return'Comprendo. Raccontami di più.';}

      /* ——— Ping server ——— */
      async checkServer(){try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});this.statusBar.textContent=r.ok?'✅ Online':'⚠️ Offline';this.statusBar.classList.toggle('connected',r.ok);}catch{this.statusBar.textContent='⚠️ Offline';}}
      
      startAutoListening(){if(!isSecureLikeContext()){this.showToast('Serve HTTPS o localhost','error');return;}navigator.mediaDevices.getUserMedia({audio:true}).then(s=>s.getTracks().forEach(t=>t.stop())).then(()=>this.startListening());}
    }

    document.addEventListener('DOMContentLoaded',()=>{window.aluia=new AluIA();});
  </script>
</body>
</html>
